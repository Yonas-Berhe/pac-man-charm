name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # =====================
  # Test Backend Unit
  # =====================
  test-backend-unit:
    name: 🐍 Backend Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run unit tests
        working-directory: ./backend
        run: uv run pytest tests/ -v

  # =====================
  # Test Backend Integration
  # =====================
  test-backend-integration:
    name: 🐍 Backend Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        working-directory: ./backend
        run: uv sync

      - name: Run integration tests
        working-directory: ./backend
        run: uv run pytest tests_integration/ -v

  # =====================
  # Test Frontend
  # =====================
  test-frontend:
    name: ⚛️ Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run tests
        working-directory: ./frontend
        run: npm test

      - name: Build check
        working-directory: ./frontend
        run: npm run build

  # =====================
  # Deploy to Render
  # =====================
  deploy:
    name: 🚀 Deploy to Render
    runs-on: ubuntu-latest
    needs: [test-backend-unit, test-backend-integration, test-frontend]  # All tests must pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Trigger Render Deploy
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set! Please add it to GitHub Repository Secrets."
            exit 1
          fi
          curl -v -X POST "$DEPLOY_URL"
