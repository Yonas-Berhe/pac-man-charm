# Render Blueprint - Infrastructure as Code
# https://render.com/docs/blueprint-spec

services:
  # Combined Web Service (Frontend + Backend)
  - type: web
    name: pacman-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pacman-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true

databases:
  # PostgreSQL Database
  - name: pacman-db
    plan: free
    databaseName: pacman
    user: pacman
